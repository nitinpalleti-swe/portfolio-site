# Ask Nitin on one small VM (AWS Lightsail): the app behind Caddy, which terminates HTTPS.
# Start / update:  docker compose up -d --build      Logs:  docker compose logs -f
services:
  app:
    build: .
    restart: unless-stopped
    logging:                       # rotate container logs: at most 3 x 10 MB per service
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env                 # secrets live only on the server (chmod 600), never in git
    environment:
      LOG_DIR: /data/logs          # request log on the named volume: the spend cap survives restarts
      TRUSTED_PROXY_HOPS: "1"      # exactly one proxy (Caddy) in front: use the last X-Forwarded-For entry
      CLIENT_IP_HEADER: ""
    volumes:
      - app_data:/data
    expose:
      - "8000"                     # reachable only from Caddy on the compose network, NOT published on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:                       # rotate container logs: at most 3 x 10 MB per service
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"              # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certificates (keep them: Let's Encrypt has rate limits)
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
